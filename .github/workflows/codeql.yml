name: CodeQL

# JavaScript/TypeScript analysis. The JS/TS extractor needs no build and finishes
# in well under a minute, so it scans every pull request, every push to main, and
# the weekly schedule. Swift lives in codeql-swift.yml instead: its extractor is
# CPU-bound (~6 min, no cross-run cache), so it runs on push + schedule only, off
# the PR path entirely.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "12 5 * * 2"
  workflow_dispatch:

# One in-flight JS/TS analysis per ref: a newer commit cancels the previous run.
# Swift uses a separate group so the two languages never cancel each other.
concurrency:
  group: codeql-js-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze javascript-typescript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Least privilege: writes live on the job, not the workflow top level.
    permissions:
      contents: read # checkout
      security-events: write # upload CodeQL results
      actions: read # CodeQL reads workflow run metadata

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: +security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: "/language:javascript-typescript"
